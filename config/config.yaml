paths:
  raw_data_dir: "data/raw"
  train_data_path: "data/raw/train_FD001.txt"
  test_data_path: "data/raw/test_FD001.txt"
  rul_data_path: "data/raw/RUL_FD001.txt"
  pipeline_export_path: "models/pipeline.joblib"
  model_export_path: "models/model.joblib"
  drift_report_path: "monitoring/drift_report.html"
  drift_metrics_path: "monitoring/drift_metrics.json"

features:
  rolling_windows: [5, 14, 21]
  drop_sensors: ['s_1', 's_5', 's_10', 's_16', 's_18', 's_19']
  setting_to_drop: 'setting_3'

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "CMAPSS_Predictive_Maintenance"
  registered_model_name: "CMAPSS_XGBoost"

quality_gate:
  f1_threshold: 0.85
  epsilon: 0.005
