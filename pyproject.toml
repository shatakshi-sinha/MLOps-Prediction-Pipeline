[project]
name = "mlops-prediction-pipeline"
version = "0.1.0"
description = "MLOps predictive maintenance pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  "xgboost>=2.0.0",
  "mlflow>=2.10.0",
  "joblib>=1.3.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "pyyaml>=6.0",
  "evidently>=0.4.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "flake8>=7.0.0",
  "black>=24.0.0",
]

[tool.vercel]
entrypoint = "src.api:app"
